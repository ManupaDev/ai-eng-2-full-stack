[project]
name = "langchain-datastream"
version = "0.1.0"
description = "Python port of @ai-sdk/langchain — converts LangChain/LangGraph streams into Vercel AI SDK UI Message Stream chunks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_datastream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
